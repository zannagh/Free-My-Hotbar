# Build validation for pushes and pull requests.
name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Calculate version
        id: version
        uses: zannagh/versionizer/calculate-version@v1

      # Build-validation runs always build as prerelease; they never ship.
      - name: Build & Stage Artifacts
        run: |
          ./gradlew stageArtifacts --stacktrace \
            -PsemVer="${{ steps.version.outputs.fullSemVer }}" \
            -Pprerelease="true"

      - name: Upload staged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mod-jars
          path: |
            staging/*.jar
            staging/versions.json
          if-no-files-found: warn
