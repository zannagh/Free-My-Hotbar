# Build validation for pushes and pull requests.
name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    # `packages: read` so Gradle can resolve the eunomia libraries from GitHub Packages
    # (see `env.GITHUB_TOKEN` below).
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    # eunomia-core/eunomia-common live in GitHub Packages (maven.pkg.github.com/zannagh/eunomia) and
    # need an authenticated read: buildSrc only declares that repository when a token is visible, and a
    # token-only shell is exactly the case the repo gate is written for (see eunomia-repositories.gradle.kts).
    # EUNOMIA_PACKAGES_TOKEN is deliberately NOT defined: eunomia is a public repo publishing a public
    # package, so the automatic token can read it. It is an escape hatch if that package ever goes
    # private (a PAT with read:packages); unset, it evaluates empty and the automatic token is used.
    env:
      GITHUB_TOKEN: ${{ secrets.EUNOMIA_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Calculate version
        id: version
        uses: zannagh/versionizer/calculate-version@v1

      # Build-validation runs always build as prerelease; they never ship.
      - name: Build & Stage Artifacts
        run: |
          ./gradlew stageArtifacts --stacktrace \
            -PsemVer="${{ steps.version.outputs.fullSemVer }}" \
            -Pprerelease="true"

      - name: Upload staged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mod-jars
          path: |
            staging/*.jar
            staging/versions.json
          if-no-files-found: warn
