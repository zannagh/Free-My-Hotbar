# Smoke test suite.
#
# Runs the JUnit `smokeTest` task, kept separate from the main `build` job so a smoke
# regression is easy to spot and so the (potentially slower) smoke suite does not block
# the fast compile/unit gate.
name: Smoke

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Gradle resolves eunomia-core/eunomia-common from GitHub Packages; reading them needs an
  # authenticated token (exported as GITHUB_TOKEN on the job below).
  packages: read

# eunomia-core/eunomia-common live in GitHub Packages (maven.pkg.github.com/zannagh/eunomia) and
# need an authenticated read: buildSrc only declares that repository when a token is visible, and a
# token-only shell is exactly the case the repo gate is written for (see eunomia-repositories.gradle.kts).
# EUNOMIA_PACKAGES_TOKEN is deliberately NOT defined: eunomia is a public repo publishing a public
# package, so the automatic token can read it. It is an escape hatch if that package ever goes
# private (a PAT with read:packages); unset, it evaluates empty and the automatic token is used.
env:
  GITHUB_TOKEN: ${{ secrets.EUNOMIA_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The `smokeTest` task is provided by the smoke test suite. It is a plain Gradle task,
      # so this stays valid even before the suite is wired up (the task simply no-ops/fails
      # loudly if absent, which is the signal you want).
      - name: Run smoke tests
        run: ./gradlew smokeTest --stacktrace
