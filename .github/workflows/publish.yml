# Build & Publish
# Publishes the Fabric + Forge jars to Modrinth/CurseForge on a published GitHub Release
# or manual dispatch. Each platform is gated on its token secret + project id being set;
# with neither set the jars are only built and attached to the release. The publish matrix
# is derived from stageArtifacts' staging/versions.json, so adding an MC version/loader is
# a stonecutter change, not a workflow edit.
name: Build & Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and resolve metadata but do not upload to any platform.'
        required: false
        default: true
        type: boolean
      force_release:
        description: 'Force a prerelease decision even if only non-code files changed.'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Modrinth project slug - the last path segment of modrinth.com/mod/<slug>. Publishing
  # also needs the MODRINTH_TOKEN secret set.
  MODRINTH_PROJECT_ID: 'free-my-hotbar'
  # CurseForge numeric project id (shown on the project page). Needs CURSEFORGE_TOKEN too.
  CURSEFORGE_PROJECT_ID: '1695040'

jobs:
  # ===========================================================================
  # PREFLIGHT - decide which platforms are configured (secrets can't be read in
  # a job-level `if:`, so this is resolved in a step and exposed as outputs).
  # ===========================================================================
  check-config:
    name: Check publish configuration
    runs-on: ubuntu-latest
    outputs:
      modrinth: ${{ steps.cfg.outputs.modrinth }}
      curseforge: ${{ steps.cfg.outputs.curseforge }}
    steps:
      - name: Resolve configuration
        id: cfg
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ env.MODRINTH_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ env.CURSEFORGE_PROJECT_ID }}
        run: |
          MODRINTH=false
          CURSEFORGE=false
          if [[ -n "$MODRINTH_TOKEN" && -n "$MODRINTH_PROJECT_ID" ]]; then MODRINTH=true; fi
          if [[ -n "$CURSEFORGE_TOKEN" && -n "$CURSEFORGE_PROJECT_ID" ]]; then CURSEFORGE=true; fi

          echo "modrinth=$MODRINTH" >> "$GITHUB_OUTPUT"
          echo "curseforge=$CURSEFORGE" >> "$GITHUB_OUTPUT"

          {
            echo "## Publish configuration"
            echo ""
            echo "| Platform | Configured | Needs |"
            echo "| --- | --- | --- |"
            echo "| Modrinth | $MODRINTH | secret \`MODRINTH_TOKEN\` + env \`MODRINTH_PROJECT_ID\` |"
            echo "| CurseForge | $CURSEFORGE | secret \`CURSEFORGE_TOKEN\` + env \`CURSEFORGE_PROJECT_ID\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$MODRINTH" != "true" && "$CURSEFORGE" != "true" ]]; then
            echo "::notice::No publish platform is configured. The jars will be built (and attached to the release, if this is a release) but nothing will be published. Set MODRINTH_TOKEN + MODRINTH_PROJECT_ID and/or CURSEFORGE_TOKEN + CURSEFORGE_PROJECT_ID in the repo settings to enable publishing."
          else
            [[ "$MODRINTH" == "true" ]] && echo "::notice::Modrinth publishing is configured."
            [[ "$CURSEFORGE" == "true" ]] && echo "::notice::CurseForge publishing is configured."
          fi

  # ===========================================================================
  # PREPARE - release preflight (version math, release decision, downgrade guard,
  # Modrinth existence check + changelogs) in one job. See prepare-release action.
  # ===========================================================================
  prepare:
    name: Prepare release
    needs: [check-config]
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.prep.outputs.should_release }}
      is_manual_release: ${{ steps.prep.outputs.is_manual_release }}
      mod_version: ${{ steps.prep.outputs.mod_version }}
      is_prerelease: ${{ steps.prep.outputs.is_prerelease }}
      version_exists: ${{ steps.prep.outputs.version_exists }}
      version_ok: ${{ steps.prep.outputs.version_ok }}
      changelog_full: ${{ steps.prep.outputs.changelog_full }}
      changelog_user: ${{ steps.prep.outputs.changelog_user }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare release
        id: prep
        uses: ./.github/actions/prepare-release
        with:
          event-name: ${{ github.event_name }}
          is-dry-run: ${{ inputs.dry_run }}
          force-release: ${{ inputs.force_release }}
          release-tag-name: ${{ github.event.release.tag_name }}
          release-prerelease: ${{ github.event.release.prerelease }}
          release-body: ${{ github.event.release.body }}
          modrinth-project-id: ${{ env.MODRINTH_PROJECT_ID }}
          repository: ${{ github.repository }}

  # ===========================================================================
  # BUILD - produces the loader jars with the GitVersion-derived version.
  # ===========================================================================
  build:
    name: Build
    needs: [check-config, prepare]
    runs-on: ubuntu-latest
    if: "!cancelled() && needs.prepare.result == 'success'"
    # `packages: read` so Gradle can resolve eunomia-core/eunomia-common from GitHub Packages
    # (see `env.GITHUB_TOKEN` below).
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    # eunomia-core/eunomia-common live in GitHub Packages (maven.pkg.github.com/zannagh/eunomia) and
    # need an authenticated read: buildSrc only declares that repository when a token is visible, and a
    # token-only shell is exactly the case the repo gate is written for (see eunomia-repositories.gradle.kts).
    # EUNOMIA_PACKAGES_TOKEN is deliberately NOT defined: eunomia is a public repo publishing a public
    # package, so the automatic token can read it. It is an escape hatch if that package ever goes
    # private (a PAT with read:packages); unset, it evaluates empty and the automatic token is used.
    env:
      GITHUB_TOKEN: ${{ secrets.EUNOMIA_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
    outputs:
      # Pass-through from prepare so downstream jobs keep reading needs.build.outputs.*.
      mod_version: ${{ needs.prepare.outputs.mod_version }}
      is_prerelease: ${{ needs.prepare.outputs.is_prerelease }}
      # The publish matrix, derived from staging/versions.json.
      supported_versions: ${{ steps.versions.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & Stage Artifacts
        run: |
          ./gradlew stageArtifacts --stacktrace \
            -PsemVer="${{ needs.prepare.outputs.mod_version }}" \
            -Pprerelease="${{ needs.prepare.outputs.is_prerelease }}"

      # Turn staging/versions.json into the publish matrix (one entry per loader/display key).
      - name: Read Supported Versions
        id: versions
        run: |
          MATRIX=$(jq -c '[to_entries[] | .key as $loader | .value | keys[] | {loader: $loader, minecraft: .}]' staging/versions.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Matrix: $MATRIX"

      - name: Upload staged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mod-jars
          path: |
            staging/*.jar
            staging/versions.json
          if-no-files-found: error

  # ===========================================================================
  # ATTACH TO GITHUB RELEASE - only on a real release; uses the built-in token.
  # ===========================================================================
  attach-to-release:
    name: Attach jars to GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    # version_ok is the soft downgrade gate from prepare-release (defaults to 'true').
    if: github.event_name == 'release' && needs.prepare.outputs.version_ok == 'true'
    permissions:
      contents: write
    steps:
      - name: Download jars
        uses: actions/download-artifact@v8
        with:
          name: mod-jars
          path: artifacts

      - name: Upload to release
        uses: softprops/action-gh-release@v2.4.2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/**/*.jar

  # ===========================================================================
  # PUBLISH TO MODRINTH - gated on Modrinth being configured.
  # ===========================================================================
  publish-modrinth:
    name: Publish to Modrinth (${{ matrix.loader }})
    needs: [check-config, prepare, build]
    runs-on: ubuntu-latest
    # Gated on: Modrinth configured, not a dry run, version passing the downgrade guard,
    # and not already on Modrinth (version_exists is empty when the check was skipped).
    if: >-
      needs.check-config.outputs.modrinth == 'true' &&
      !inputs.dry_run &&
      needs.prepare.outputs.version_ok == 'true' &&
      needs.prepare.outputs.version_exists != 'true'
    strategy:
      fail-fast: false
      # Serialize: parallel jobs hammer Modrinth's tag API and can get rate-limited (429),
      # which silently yields empty loaders/game_versions metadata on the published version.
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.build.outputs.supported_versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download jars
        uses: actions/download-artifact@v8
        with:
          name: mod-jars
          path: artifacts

      - name: Get game versions
        id: game-versions
        run: |
          VERSIONS=$(jq -r '."${{ matrix.loader }}"."${{ matrix.minecraft }}" // ["${{ matrix.minecraft }}"] | .[]' artifacts/versions.json)
          {
            echo "list<<EOF"
            echo "$VERSIONS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare upload
        id: prep
        uses: ./.github/actions/prepare-modrinth-upload
        with:
          display-version: ${{ matrix.minecraft }}
          mod-version: ${{ needs.build.outputs.mod_version }}
          is-prerelease: ${{ needs.build.outputs.is_prerelease }}
          artifact-path: artifacts
          loader: ${{ matrix.loader }}

      - name: Publish to Modrinth
        if: steps.prep.outputs.found == 'true'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.prep.outputs.jar_path }}
          name: ${{ steps.prep.outputs.version_name }}
          version: ${{ steps.prep.outputs.version_number }}
          version-type: ${{ steps.prep.outputs.version_type }}
          loaders: |
            ${{ matrix.loader }}
            ${{ matrix.loader == 'fabric' && 'quilt' || '' }}
          game-versions: |
            ${{ steps.game-versions.outputs.list }}
          game-version-filter: any
          changelog: ${{ needs.prepare.outputs.changelog_user }}
          modrinth-featured: false
          retry-attempts: 2
          retry-delay: 10000

  # ===========================================================================
  # PUBLISH TO CURSEFORGE - gated on CurseForge being configured.
  # ===========================================================================
  publish-curseforge:
    name: Publish to CurseForge (${{ matrix.loader }})
    needs: [check-config, prepare, build]
    runs-on: ubuntu-latest
    # Only version_ok gates here; version_exists is Modrinth-specific.
    if: >-
      needs.check-config.outputs.curseforge == 'true' &&
      !inputs.dry_run &&
      needs.prepare.outputs.version_ok == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.build.outputs.supported_versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download jars
        uses: actions/download-artifact@v8
        with:
          name: mod-jars
          path: artifacts

      - name: Get game versions
        id: game-versions
        run: |
          VERSIONS=$(jq -r '."${{ matrix.loader }}"."${{ matrix.minecraft }}" // ["${{ matrix.minecraft }}"] | .[]' artifacts/versions.json)
          {
            echo "list<<EOF"
            echo "$VERSIONS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare upload
        id: prep
        uses: ./.github/actions/prepare-modrinth-upload
        with:
          display-version: ${{ matrix.minecraft }}
          mod-version: ${{ needs.build.outputs.mod_version }}
          is-prerelease: ${{ needs.build.outputs.is_prerelease }}
          artifact-path: artifacts
          loader: ${{ matrix.loader }}

      - name: Publish to CurseForge
        if: steps.prep.outputs.found == 'true'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.prep.outputs.jar_path }}
          name: ${{ steps.prep.outputs.version_name }}
          version: ${{ steps.prep.outputs.version_number }}
          version-type: ${{ steps.prep.outputs.version_type }}
          loaders: |
            ${{ matrix.loader }}
            ${{ matrix.loader == 'fabric' && 'quilt' || '' }}
          game-versions: |
            ${{ steps.game-versions.outputs.list }}
          game-version-filter: any
          changelog: ${{ needs.prepare.outputs.changelog_user }}
          retry-attempts: 2
          retry-delay: 10000
          # Warn (don't fail) when CurseForge lacks a game version yet, e.g. a brand-new
          # snapshot CF hasn't added. Re-run once CF catches up.
          curseforge-fail-mode: warn
