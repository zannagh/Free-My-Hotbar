# Publish Existing Release
# Manually re-publish the jars already attached to a GitHub release/prerelease to Modrinth
# and/or CurseForge WITHOUT rebuilding. Dispatch-only, restricted to repository admins.
# Slugs/ids are kept in sync with publish.yml. The publish matrix + game versions are
# reconstructed from the release jar names + stonecutter.properties.toml.
name: Publish Existing Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. v1.0.0).'
        required: true
        type: string
      platforms:
        description: 'Which platforms to publish to.'
        required: true
        default: both
        type: choice
        options:
          - both
          - modrinth
          - curseforge
      dry_run:
        description: 'Preview only - resolve metadata but do not upload.'
        required: false
        default: true
        type: boolean

concurrency:
  group: publish-existing-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Modrinth project slug - keep in sync with publish.yml. Needs MODRINTH_TOKEN too.
  MODRINTH_PROJECT_ID: 'free-my-hotbar'
  # CurseForge numeric project id - keep in sync with publish.yml. Needs CURSEFORGE_TOKEN too.
  CURSEFORGE_PROJECT_ID: '1695040'

jobs:
  # ===========================================================================
  # PREFLIGHT - which platforms are configured.
  # ===========================================================================
  check-config:
    name: Check publish configuration
    runs-on: ubuntu-latest
    outputs:
      modrinth: ${{ steps.cfg.outputs.modrinth }}
      curseforge: ${{ steps.cfg.outputs.curseforge }}
    steps:
      - name: Resolve configuration
        id: cfg
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ env.MODRINTH_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ env.CURSEFORGE_PROJECT_ID }}
        run: |
          MODRINTH=false
          CURSEFORGE=false
          if [[ -n "$MODRINTH_TOKEN" && -n "$MODRINTH_PROJECT_ID" ]]; then MODRINTH=true; fi
          if [[ -n "$CURSEFORGE_TOKEN" && -n "$CURSEFORGE_PROJECT_ID" ]]; then CURSEFORGE=true; fi
          echo "modrinth=$MODRINTH" >> "$GITHUB_OUTPUT"
          echo "curseforge=$CURSEFORGE" >> "$GITHUB_OUTPUT"
          if [[ "$MODRINTH" != "true" && "$CURSEFORGE" != "true" ]]; then
            echo "::notice::No publish platform is configured - nothing will be published. Set MODRINTH_TOKEN + MODRINTH_PROJECT_ID and/or CURSEFORGE_TOKEN + CURSEFORGE_PROJECT_ID in the repo settings."
          fi

  # ===========================================================================
  # PREPARE - admin gate, download release assets, resolve version metadata.
  # ===========================================================================
  prepare:
    name: Prepare release assets
    needs: [check-config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.metadata.outputs.matrix }}
      mod_version: ${{ steps.release.outputs.mod_version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      changelog: ${{ steps.body.outputs.content }}
    steps:
      - name: Verify actor is a repository admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERM=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" --jq '.permission')
          echo "Actor '${{ github.actor }}' has repository permission: $PERM"
          if [[ "$PERM" != "admin" ]]; then
            echo "::error::Only repository admins/owners may run this workflow (actor has '$PERM')."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern '*.jar' \
            --dir release-assets
          echo "Downloaded assets:"
          ls -1 release-assets

      - name: Resolve release info
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          MOD_VERSION="${TAG#v}"
          IS_PRERELEASE=$(gh release view "$TAG" --repo "${{ github.repository }}" --json isPrerelease --jq '.isPrerelease')
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Mod version: $MOD_VERSION (prerelease: $IS_PRERELEASE)"

      - name: Read release body
        id: body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" --json body --jq '.body')
          {
            echo "content<<RELEASE_BODY_EOF"
            echo "$BODY"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # Rebuild the {loader:{display:[game_versions]}} map + publish matrix from the release
      # jar names (<base>-<loader>-<semver>+<display>.jar) and the per-MC toml sections.
      - name: Reconstruct version metadata
        id: metadata
        run: |
          python3 - <<'PY'
          import json, os, re, tomllib
          cfg = tomllib.load(open("stonecutter.properties.toml", "rb"))
          display_to_games = {}
          for section in cfg.values():
              if isinstance(section, dict) and "display_version" in section and "game_versions" in section:
                  games = sorted({g.strip() for g in section["game_versions"].split(",") if g.strip()})
                  display_to_games.setdefault(section["display_version"], games)
          pattern = re.compile(r"^free-my-hotbar-(fabric|forge)-.+\+(.+)\.jar$")
          versions, matrix, seen = {}, [], set()
          for name in sorted(os.listdir("release-assets")):
              if name.endswith("-sources.jar"):
                  continue
              m = pattern.match(name)
              if not m:
                  print(f"::warning::Skipping unrecognized asset: {name}")
                  continue
              loader, display = m.group(1), m.group(2)
              if (loader, display) in seen:
                  continue
              seen.add((loader, display))
              games = display_to_games.get(display)
              if games is None:
                  print(f"::warning::No game_versions mapping for '{display}' - falling back to ['{display}']")
                  games = [display]
              versions.setdefault(loader, {})[display] = games
              matrix.append({"loader": loader, "minecraft": display})
          if not matrix:
              raise SystemExit("::error::No publishable free-my-hotbar jars found in the release assets.")
          with open("release-assets/versions.json", "w") as fh:
              json.dump(versions, fh, indent=2, sort_keys=True)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps(matrix) + "\n")
          print("versions.json:"); print(json.dumps(versions, indent=2, sort_keys=True))
          print("matrix:", json.dumps(matrix))
          PY

      - name: Upload prepared assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ inputs.tag }}
          path: |
            release-assets/*.jar
            release-assets/versions.json
          if-no-files-found: error

  # ===========================================================================
  # PUBLISH TO MODRINTH
  # ===========================================================================
  publish-modrinth:
    name: Publish to Modrinth (${{ matrix.loader }})
    needs: [check-config, prepare]
    runs-on: ubuntu-latest
    if: >-
      needs.check-config.outputs.modrinth == 'true' &&
      (inputs.platforms == 'both' || inputs.platforms == 'modrinth') &&
      !inputs.dry_run
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download prepared assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets-${{ inputs.tag }}
          path: artifacts

      - name: Get game versions
        id: game-versions
        run: |
          VERSIONS=$(jq -r '."${{ matrix.loader }}"."${{ matrix.minecraft }}" // ["${{ matrix.minecraft }}"] | .[]' artifacts/versions.json)
          {
            echo "list<<EOF"
            echo "$VERSIONS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare upload
        id: prep
        uses: ./.github/actions/prepare-modrinth-upload
        with:
          display-version: ${{ matrix.minecraft }}
          mod-version: ${{ needs.prepare.outputs.mod_version }}
          is-prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          artifact-path: artifacts
          loader: ${{ matrix.loader }}

      - name: Publish to Modrinth
        if: steps.prep.outputs.found == 'true'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.prep.outputs.jar_path }}
          name: ${{ steps.prep.outputs.version_name }}
          version: ${{ steps.prep.outputs.version_number }}
          version-type: ${{ steps.prep.outputs.version_type }}
          loaders: |
            ${{ matrix.loader }}
            ${{ matrix.loader == 'fabric' && 'quilt' || '' }}
          game-versions: |
            ${{ steps.game-versions.outputs.list }}
          game-version-filter: any
          changelog: ${{ needs.prepare.outputs.changelog }}
          modrinth-featured: false
          retry-attempts: 2
          retry-delay: 10000

  # ===========================================================================
  # PUBLISH TO CURSEFORGE
  # ===========================================================================
  publish-curseforge:
    name: Publish to CurseForge (${{ matrix.loader }})
    needs: [check-config, prepare]
    runs-on: ubuntu-latest
    if: >-
      needs.check-config.outputs.curseforge == 'true' &&
      (inputs.platforms == 'both' || inputs.platforms == 'curseforge') &&
      !inputs.dry_run
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download prepared assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets-${{ inputs.tag }}
          path: artifacts

      - name: Get game versions
        id: game-versions
        run: |
          VERSIONS=$(jq -r '."${{ matrix.loader }}"."${{ matrix.minecraft }}" // ["${{ matrix.minecraft }}"] | .[]' artifacts/versions.json)
          {
            echo "list<<EOF"
            echo "$VERSIONS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare upload
        id: prep
        uses: ./.github/actions/prepare-modrinth-upload
        with:
          display-version: ${{ matrix.minecraft }}
          mod-version: ${{ needs.prepare.outputs.mod_version }}
          is-prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          artifact-path: artifacts
          loader: ${{ matrix.loader }}

      - name: Publish to CurseForge
        if: steps.prep.outputs.found == 'true'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.prep.outputs.jar_path }}
          name: ${{ steps.prep.outputs.version_name }}
          version: ${{ steps.prep.outputs.version_number }}
          version-type: ${{ steps.prep.outputs.version_type }}
          loaders: |
            ${{ matrix.loader }}
            ${{ matrix.loader == 'fabric' && 'quilt' || '' }}
          game-versions: |
            ${{ steps.game-versions.outputs.list }}
          game-version-filter: any
          changelog: ${{ needs.prepare.outputs.changelog }}
          retry-attempts: 2
          retry-delay: 10000
          curseforge-fail-mode: warn
